[package]
name = "alloy-app"
version = "0.1.0"
description = "Alloy Tauri 2 desktop and mobile shell"
authors = ["Alloy Contributors"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "alloy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-protocol = { path = "../../../crates/alloy-protocol" }
alloy-engine = { path = "../../../crates/alloy-engine" }
alloy-core = { path = "../../../crates/alloy-core" }
alloy-storage = { path = "../../../crates/alloy-storage", features = ["keyring"] }
tokio = { version = "1", features = ["sync", "rt"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
