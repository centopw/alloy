[package]
name = "alloy-app"
version = "0.3.0"
description = "Alloy Tauri 2 desktop and mobile shell"
authors = ["Alloy Contributors"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "alloy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-protocol = { path = "../../../crates/alloy-protocol" }
alloy-engine = { path = "../../../crates/alloy-engine" }
alloy-core = { path = "../../../crates/alloy-core" }
alloy-storage = { path = "../../../crates/alloy-storage", features = ["keyring"] }
tokio = { version = "1", features = ["sync", "rt"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "android")'.dependencies]
alloy-ffi = { path = "../../../crates/alloy-ffi" }
