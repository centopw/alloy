[package]
name = "alloy-app"
version = "0.4.18"
description = "Alloy Tauri 2 desktop and mobile shell"
authors = ["Alloy Contributors"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "alloy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-protocol = { path = "../../../crates/alloy-protocol" }
alloy-engine = { path = "../../../crates/alloy-engine" }
alloy-store = { path = "../../../crates/alloy-store" }
alloy-storage = { path = "../../../crates/alloy-storage", features = ["keyring"] }
tokio = { version = "1", features = ["sync", "rt"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

# Reading Chrome's cookie store happens only on macOS (see `src/chrome.rs`); the crates are not
# linked anywhere else. rusqlite is unfetched here because alloy-store already selects its
# `bundled` SQLite for the same build.
[target.'cfg(target_os = "macos")'.dependencies]
aes = "0.8"
cbc = "0.1"
keyring = { version = "3.6", features = ["apple-native"] }
pbkdf2 = { version = "0.13", features = ["hmac"] }
rusqlite = "0.41"
sha1 = "0.11"
sha2 = "0.10"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Validates every OS root certificate before reqwest sees it: reqwest's rustls root store fails the
# whole client build on one bad entry, so malformed files in the OS store must be dropped first.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std"] }
