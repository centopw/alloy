# Hosted mode (Cloudflare Workers + KV). See README.md.
#
#   npx wrangler kv namespace create SYNC_KV     -> paste the id below
#   npx wrangler secret put SYNC_TOKENS          -> "token1,token2:67108864"
#   npx wrangler deploy

name = "alloy-sync"
main = "src/worker.js"
compatibility_date = "2026-11-16"

kv_namespaces = [
  { binding = "SYNC_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" },
]

[vars]
SYNC_LOG = "0"
