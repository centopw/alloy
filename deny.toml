# Alloy cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisory database: https://github.com/rustsec/advisory-db
# Deny vulnerabilities by default; unmaintained advisories in transitive
# dependencies (e.g. anymap2 in matrix-sdk, proc-macro-error in gtk) are not blocked.
yanked = "warn"
unmaintained = "none"
ignore = []

[licenses]
# All Alloy dependencies must be compatible with Apache-2.0
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Unused allowed licenses in this config produce a note/allow, not an error
unused-allowed-license = "allow"

[licenses.private]
# Ignore workspace members and private registries
ignore = true

[bans]
# Warn on duplicate versions (not a hard error)
multiple-versions = "warn"
highlight = "all"

[sources]
# Disallow registries other than crates.io
unknown-registry = "deny"
# Disallow git dependencies
unknown-git = "deny"
# crates.io is the only allowed registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
