# Alloy cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisory database: https://github.com/rustsec/advisory-db
# Everything is checked, including unmaintained crates and unsound code. Each exception below is
# a transitive dependency we cannot change from this repository, with the reason it is accepted
# and what has to happen upstream to drop it. Any new advisory fails CI. Keep this list in sync
# with .cargo/audit.toml (cargo-audit reads that file).
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # zip 4.x, pulled in by tauri-plugin-updater (latest 2.x). The flaws are in `extract()`
    # (SUID bits, symlink escapes). The updater only extracts a package after its minisign
    # signature has verified, and only on Windows (the macOS and Linux paths use tar). Exploiting
    # it needs our updater signing key. Drop when tauri-plugin-updater moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater; extracts only signature-verified packages, Windows only" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater; extracts only signature-verified packages, Windows only" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater; extracts only signature-verified packages, Windows only" },
    # matrix-sdk 0.19.1 (latest) depends on anymap2; no replacement upstream yet.
    { id = "RUSTSEC-2026-0319", reason = "anymap2 via matrix-sdk 0.19.1; used for a type map, no fix upstream" },
    # RUSTSEC-2024-0388 (derivative via matrix-sdk's wasm-only wasm_evt_listener) is not in this
    # graph, so only .cargo/audit.toml, which scans the whole lockfile, lists it.
    # gtk3-rs 0.18 stack used by tauri/wry on Linux. Fixed only by moving to gtk4, which is a
    # tauri/wry decision. Alloy does not call glib::VariantStrIter.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-rs (tauri/wry on Linux); build-time only" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness via tauri/wry on Linux; API not used" },
    # zbus/zvariant family flagged unmaintained. zbus 5 comes from tauri-plugin-opener (Linux),
    # zbus 4 from keyring's Secret Service backend (Linux). Neither has a maintained successor
    # we could switch to without replacing the platform keychain integration.
    # zstd 0.13 / zstd-safe 7.x, pulled in by wasmtime-internal-cache through wasmtime's default
    # `cache` feature. The plugin host builds its Engine with fuel and epoch limits only and never
    # configures a module cache (no cache_config_load), so none of this compression code runs. The
    # fix needs zstd >= 0.14.3 / zstd-safe >= 8.2.0, which wasmtime still pins out (wasmtime 50.0.0
    # also asks for zstd ^0.13); drop these when wasmtime accepts zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "zstd via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0395", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0396", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0397", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0399", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0400", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0401", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0402", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0404", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0405", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0406", reason = "zstd-safe via wasmtime-internal-cache; module cache never configured" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via tauri-plugin-opener and keyring (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via tauri-plugin-opener and keyring (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via tauri-plugin-opener and keyring (Linux D-Bus)" },
]

[licenses]
# All Alloy dependencies must be compatible with Apache-2.0
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Unused allowed licenses in this config produce a note/allow, not an error
unused-allowed-license = "allow"

[licenses.private]
# Ignore workspace members and private registries
ignore = true

[bans]
# Warn on duplicate versions (not a hard error)
multiple-versions = "warn"
highlight = "all"

[sources]
# Disallow registries other than crates.io
unknown-registry = "deny"
# Disallow git dependencies
unknown-git = "deny"
# crates.io is the only allowed registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
