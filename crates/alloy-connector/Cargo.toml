[package]
name = "alloy-connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt", "sync"] }

[features]
# Enables `alloy_connector::fake`, the deterministic in-memory connector used by the contract
# tests and, from M1 on, by desktop and Android end-to-end tests. Never enabled in release builds.
testing = []

[[test]]
name = "contract"
path = "tests/contract.rs"
required-features = ["testing"]
