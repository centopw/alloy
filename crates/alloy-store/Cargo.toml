[package]
name = "alloy-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# XChaCha20-Poly1305 for connector session material at rest. 0.11 is the stable RustCrypto
# release already in Cargo.lock (aead 0.6), so no second crypto stack is pulled in.
chacha20poly1305 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync", "rt"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.0", features = ["full"] }
