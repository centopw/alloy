[package]
name = "alloy-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-connector = { path = "../alloy-connector" }
alloy-protocol = { path = "../alloy-protocol" }
alloy-sidecar = { path = "../alloy-sidecar" }
alloy-storage = { path = "../alloy-storage" }
alloy-store = { path = "../alloy-store" }
alloy-sync = { path = "../alloy-sync" }
alloy-telegram = { path = "../alloy-telegram" }
alloy-theme = { path = "../alloy-theme" }
# Recovery phrase: 24 BIP39 words; the phrase is the only input to the escrow key.
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
bip39 = { version = "2.2", features = ["rand"] }
# Escrow blob AEAD, the same RustCrypto release alloy-store and alloy-sync already use.
chacha20poly1305 = "0.11"
# The device's own Ed25519 identity, countersigned into the roster on enrolment.
ed25519-dalek = "2.2"
getrandom = "0.3"
# Blob ids are HMAC-SHA256(addr_key, slot), exactly as ADR 0020 defines them.
hmac = "0.12"
# Sync server transport. rustls only: http is accepted for loopback endpoints alone.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# The pin verifier hooks into reqwest's rustls client; the provider matches reqwest's.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
# Key material is wiped when the recovery escrow and the device key drop.
zeroize = "1.8"

[dev-dependencies]
alloy-connector = { path = "../alloy-connector", features = ["testing"] }
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }

[features]
# Builds the deterministic fake connector factory used by the engine's end-to-end tests.
testing = ["alloy-connector/testing"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["testing"]

[[test]]
name = "accounts_config"
path = "tests/accounts_config.rs"
required-features = ["testing"]

[[test]]
name = "network_settings"
path = "tests/network_settings.rs"
required-features = ["testing"]

[[test]]
name = "sync"
path = "tests/sync.rs"
required-features = ["testing"]

[[test]]
name = "sync_server"
path = "tests/sync_server.rs"
required-features = ["testing"]
