[package]
name = "alloy-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
alloy-protocol = { path = "../alloy-protocol" }
alloy-core = { path = "../alloy-core" }
alloy-storage = { path = "../alloy-storage" }
alloy-theme = { path = "../alloy-theme" }
tokio = { version = "1.0", features = ["sync", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.8"
matrix-sdk = { version = "0.19.1", default-features = false }
