[package]
name = "alloy-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-connector = { path = "../alloy-connector" }
alloy-protocol = { path = "../alloy-protocol" }
alloy-sidecar = { path = "../alloy-sidecar" }
alloy-storage = { path = "../alloy-storage" }
alloy-store = { path = "../alloy-store" }
alloy-telegram = { path = "../alloy-telegram" }
alloy-theme = { path = "../alloy-theme" }
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
alloy-connector = { path = "../alloy-connector", features = ["testing"] }
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }

[features]
# Builds the deterministic fake connector factory used by the engine's end-to-end tests.
testing = ["alloy-connector/testing"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["testing"]

[[test]]
name = "accounts_config"
path = "tests/accounts_config.rs"
required-features = ["testing"]
