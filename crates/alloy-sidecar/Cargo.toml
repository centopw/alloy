[package]
name = "alloy-sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-connector = { path = "../alloy-connector" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }

[features]
# Enables the `fake-sidecar` test binary (it wraps `alloy_connector::fake`, which only exists
# with alloy-connector's `testing` feature) and the integration test that drives it.
fake-sidecar = ["alloy-connector/testing"]

[[bin]]
name = "fake-sidecar"
path = "src/bin/fake-sidecar.rs"
required-features = ["fake-sidecar"]

[[test]]
name = "sidecar"
path = "tests/sidecar.rs"
required-features = ["fake-sidecar"]
