[package]
name = "alloy-telegram"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-connector = { path = "../alloy-connector" }
async-trait = "0.1"
# URL-safe base64 for QR payloads and file references inside media pointers.
base64 = "0.22"
# `fs` for file upload and download, `html` for entity <-> HTML conversion of message bodies.
grammers-client = { version = "0.12", default-features = false, features = ["fs", "html"] }
grammers-mtsender = "0.12"
# `serde` so the datacenter and peer state inside the session blob round-trips; the default
# features pull in a SQLite storage we do not use (the host persists the blob).
grammers-session = { version = "0.12", default-features = false, features = ["serde"] }
grammers-tl-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
alloy-connector = { path = "../alloy-connector", features = ["testing"] }
tokio = { version = "1.0", features = ["full"] }
