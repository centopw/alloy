[package]
name = "alloy-bridge"
version = "0.1.0"
description = "Dev/web bridge exposing the Alloy engine over a loopback WebSocket"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-engine = { path = "../alloy-engine" }
alloy-protocol = { path = "../alloy-protocol" }
alloy-storage = { path = "../alloy-storage" }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
