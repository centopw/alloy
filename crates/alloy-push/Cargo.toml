[package]
name = "alloy-push"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-core = { path = "../alloy-core" }
alloy-storage = { path = "../alloy-storage" }
matrix-sdk = { version = "0.19.1", features = ["e2e-encryption", "sqlite"] }
matrix-sdk-ui = "0.19.1"
tokio = { version = "1.0", features = ["sync", "rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ruma = "0.17.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.8"
wiremock = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
