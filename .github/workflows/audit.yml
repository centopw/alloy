name: Security Audit

on:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'

# The audit fails the job (and so shows in the Actions tab and e-mail) instead of opening an issue
# per advisory. Accepted advisories live in deny.toml and .cargo/audit.toml, each with its reason.
jobs:
  audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Reads .cargo/audit.toml: warnings (unmaintained, unsound, yanked) fail the run.
      - name: Run cargo-audit
        run: cargo audit

      - name: Run cargo-deny
        run: cargo deny check
