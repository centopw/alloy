name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  UI_DIR: apps/alloy

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            case "${{ github.event.before }}" in 0000000*) range="${{ github.sha }}" ;; esac
          fi
          for c in $(git rev-list "$range"); do
            git log -1 --format=%B "$c" | scripts/check-commit-msg.sh - || { echo "::error::bad commit $c"; exit 1; }
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy-test:
    name: Clippy & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/alloy/src-tauri

      - name: Clippy (zero warnings policy)
        run: cargo clippy -D warnings --workspace

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: theme-css-check
        if: matrix.os == 'ubuntu-latest' && hashFiles('crates/alloy-theme/src/bin/gen-css.rs') != ''
        run: cargo run -p alloy-theme --bin gen-css -- --check

      - name: protocol-ts-check
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p alloy-protocol --bin generate-types
          git diff --exit-code apps/alloy/ui/src/lib/generated

  cargo-deny:
    name: Cargo Deny (Licenses & Bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ui:
    name: UI (Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.UI_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.UI_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build frontend production assets
        run: pnpm build

      - name: ui-test
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            pnpm test
          elif [ -f "ui/package.json" ] && grep -q '"test"' ui/package.json; then
            pnpm --prefix ui test
          else
            echo "No test script found in package.json; skipping vitest"
          fi

  mobile-android:
    name: Mobile Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android project files
        id: check-android
        run: |
          if [ -n "${{ hashFiles('apps/alloy/src-tauri/gen/android/**') }}" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.check-android.outputs.has_android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.check-android.outputs.has_android == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Rust & Android targets
        if: steps.check-android.outputs.has_android == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install pnpm
        if: steps.check-android.outputs.has_android == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        if: steps.check-android.outputs.has_android == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        if: steps.check-android.outputs.has_android == 'true'
        working-directory: ${{ env.UI_DIR }}
        run: pnpm install

      - name: Install Tauri CLI
        if: steps.check-android.outputs.has_android == 'true'
        run: cargo install tauri-cli --locked --version '^2'

      - name: Build Android APK
        if: steps.check-android.outputs.has_android == 'true'
        working-directory: ${{ env.UI_DIR }}
        run: cargo tauri android build --apk

  synapse-integration:
    name: Synapse Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/alloy/src-tauri

      - name: Start Synapse Homeserver
        run: |
          bash tests/synapse/start.sh
          bash tests/synapse/register_test_users.sh || true

      - name: Run Synapse integration tests
        env:
          ALLOY_TEST_HS: http://localhost:8008
        run: cargo test -p alloy-core --test synapse_integration -- --nocapture

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/synapse-logs
          docker compose -f tests/synapse/docker-compose.yml logs > /tmp/synapse-logs/synapse.log 2>&1 || true

      - name: Upload Synapse Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-docker-logs
          path: /tmp/synapse-logs/synapse.log
          if-no-files-found: ignore
