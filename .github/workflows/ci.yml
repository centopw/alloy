name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.githooks/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.githooks/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UI_DIR: apps/alloy/ui

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            case "${{ github.event.before }}" in 0000000*) range="${{ github.sha }}" ;; esac
          fi
          for c in $(git rev-list "$range"); do
            git log -1 --format=%B "$c" | scripts/check-commit-msg.sh - || { echo "::error::bad commit $c"; exit 1; }
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy-test:
    name: Clippy & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - name: Install Tauri system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy findings are platform independent here; Windows only runs the tests (its slowest leg).
      - name: Clippy (zero warnings policy)
        if: matrix.os != 'windows-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: theme-css-check
        if: matrix.os == 'ubuntu-latest' && hashFiles('crates/alloy-theme/src/bin/gen-css.rs') != ''
        run: cargo run -p alloy-theme --bin gen-css -- --check

      - name: protocol-ts-check
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p alloy-protocol --bin generate-types
          git diff --exit-code apps/alloy/ui/src/lib/generated

  cargo-deny:
    name: Cargo Deny (Licenses & Bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ui:
    name: UI (Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.UI_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.UI_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build frontend production assets
        run: pnpm build

      - name: ui-test
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            pnpm test
          elif [ -f "ui/package.json" ] && grep -q '"test"' ui/package.json; then
            pnpm --prefix ui test
          else
            echo "No test script found in package.json; skipping vitest"
          fi

  mobile-android:
    name: Mobile Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android project files
        id: check-android
        run: |
          if [ -n "${{ hashFiles('apps/alloy/src-tauri/gen/android/**') }}" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.check-android.outputs.has_android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust & Android targets
        if: steps.check-android.outputs.has_android == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & targets
        if: steps.check-android.outputs.has_android == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64-debug
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        if: steps.check-android.outputs.has_android == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        if: steps.check-android.outputs.has_android == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        if: steps.check-android.outputs.has_android == 'true'
        working-directory: ${{ env.UI_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build Android APK (debug, arm64)
        if: steps.check-android.outputs.has_android == 'true'
        working-directory: apps/alloy
        run: pnpm tauri android build --apk --debug --target aarch64

  synapse-integration:
    name: Synapse Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-ubuntu-latest
          save-if: false

      - name: Start Synapse Homeserver
        run: |
          bash tests/synapse/start.sh
          bash tests/synapse/register_test_users.sh || true

      - name: Run Synapse integration tests
        env:
          ALLOY_TEST_HS: http://localhost:8008
        run: cargo test -p alloy-core --test synapse_integration -- --nocapture

      - name: Run engine integration tests (auth, rooms, timeline, crypto, media)
        env:
          ALLOY_TEST_HS: http://localhost:8008
        run: cargo test -p alloy-engine -- --nocapture

      - name: Build engine bridge
        run: cargo build -p alloy-bridge

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: apps/alloy/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Full-stack E2E (UI + bridge + Synapse)
        working-directory: apps/alloy/ui
        env:
          ALLOY_TEST_HS: http://localhost:8008
          ALLOY_BRIDGE_BIN: ${{ github.workspace }}/target/debug/alloy-bridge
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/e2e-bridge.mjs

      - name: Mobile E2E (390x844 touch: no page scroll, 44px targets)
        working-directory: apps/alloy/ui
        env:
          ALLOY_TEST_HS: http://localhost:8008
          ALLOY_BRIDGE_BIN: ${{ github.workspace }}/target/debug/alloy-bridge
          CHROME_PATH: /usr/bin/google-chrome
          E2E_MOBILE: '1'
          E2E_STRICT: '1'
        run: node scripts/e2e-bridge.mjs

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/synapse-logs
          docker compose -f tests/synapse/docker-compose.yml logs > /tmp/synapse-logs/synapse.log 2>&1 || true

      - name: Upload Synapse Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-docker-logs
          path: /tmp/synapse-logs/synapse.log
          if-no-files-found: ignore
