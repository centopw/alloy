name: Release

on:
  push:
    tags:
      - 'v*'

# A second run for the same tag (a re-push) waits instead of racing the first one on release assets and latest.json.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Read-only by default; the jobs that publish assets ask for write access themselves.
permissions:
  contents: read

jobs:
  # Nothing is built or published unless the tag matches the app version, has CHANGELOG notes, sits on
  # main and has a green CI run for that exact commit (scripts/verify-release.sh). Every other job
  # depends on this one through create-release.
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/verify-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  create-release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff and cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff,cargo-cyclonedx

      # Highlights from CHANGELOG.md, grouped commits since the previous version, a compare link and
      # the install notes. Re-runs refresh the notes of an existing release.
      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force
          scripts/release-notes.sh "$TAG" > /tmp/release-notes.md
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" \
              --title "Alloy $TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" -R "$REPO" --prerelease \
              --title "Alloy $TAG" --notes-file /tmp/release-notes.md
          fi

      # The SBOM only needs Cargo.lock and the package metadata, not a build, so all four platforms are
      # generated here in seconds (with their own target, so platform-only crates are listed correctly)
      # instead of in each slow build job.
      - name: Generate and upload the SBOMs (CycloneDX)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for pair in macos-arm64:aarch64-apple-darwin macos-x64:x86_64-apple-darwin \
                      linux:x86_64-unknown-linux-gnu windows:x86_64-pc-windows-msvc; do
            platform="${pair%%:*}"
            target="${pair#*:}"
            cargo cyclonedx --format json --all --target "$target"
            cp apps/alloy/src-tauri/alloy-app.cdx.json "alloy-sbom-$platform.json"
          done
          gh release upload "$TAG" alloy-sbom-*.json --clobber

  build-tauri:
    needs: create-release
    name: Build Desktop Bundles (${{ matrix.platform }})
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          # Stays on 22.04 on purpose: the AppImage links the runner's glibc, and a newer image would stop
          # it from starting on older distributions. GitHub retires this image on April 17 2027.
          - os: ubuntu-22.04
            platform: linux
            target: ''
            tauri_args: ''
          - os: windows-latest
            platform: windows
            target: ''
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same key as the nightly builds, which populate it from main. A tag run cannot reuse anything it saves
      # (caches are scoped to the ref), so this job only restores.
      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-release-${{ matrix.platform }}
          workspaces: |
            . -> target
          save-if: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The UI itself is built by `tauri build` (beforeBuildCommand); only its dependencies are installed here.
      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Export signing secrets that are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri treats an empty variable as "signing requested", so export only non-empty secrets.
          # For macOS signing:
          # When APPLE_ID is present, a real Apple Developer ID is configured; export
          # APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD so Tauri's built-in tauri-macos-sign
          # manages the temporary keychain, resolves the team ID, signs, and notarizes.
          # When APPLE_ID is absent, any APPLE_CERTIFICATE is self-signed and must NOT be exported
          # to GITHUB_ENV, because tauri-macos-sign requires an Apple Team ID to resolve identities
          # and fails with "failed to resolve signing identity". The dedicated macOS step below imports
          # the self-signed certificate into a persistent user keychain for codesign instead.
          for v in APPLE_SIGNING_IDENTITY APPLE_ID \
                   APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"
            if [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
              echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
            fi
          fi

      # Without an Apple Developer ID the certificate is self-signed (.github/macos-signing-cert.pem, docs/RELEASING.md).
      # tauri-macos-sign requires an Apple Team ID to resolve identities from APPLE_CERTIFICATE, so for self-signed
      # certs we import the .p12 into a persistent user keychain, configure partition lists and trust settings,
      # and point Tauri at the identity name via TAURI_CONFIG while keeping APPLE_CERTIFICATE out of Tauri's env.
      # Tauri then signs with codesign directly from the default keychain.
      # With a real Apple certificate (APPLE_ID set) Tauri's built-in certificate/notarization flow is used instead.
      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No macOS signing certificate configured; builds are signed ad hoc."
            exit 0
          fi

          if [ -n "${APPLE_ID:-}" ]; then
            echo "Apple Developer ID configured; keeping Tauri built-in certificate and notarization flow."
            exit 0
          fi

          SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:-Alloy Release Signing}"
          echo "Setting up self-signed macOS certificate for identity: $SIGNING_IDENTITY"

          # Trust the public certificate root for code signing in the System keychain
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/macos-signing-cert.pem

          # Create a dedicated user keychain and keep it unlocked for codesign
          KEYCHAIN_PATH="$HOME/Library/Keychains/alloy-signing.keychain-db"
          KEYCHAIN_PWD="alloy-signing-keychain"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add to the user keychain search list and set as default keychain
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc=$(echo "$kc" | tr -d '"' | xargs)
            if [ -n "$kc" ]; then
              EXISTING_KEYCHAINS+=("$kc")
            fi
          done < <(security list-keychains -d user)

          security list-keychains -d user -s "$KEYCHAIN_PATH" ${EXISTING_KEYCHAINS[@]+"${EXISTING_KEYCHAINS[@]}"}
          security default-keychain -s "$KEYCHAIN_PATH"

          # Decode and import the PKCS12 certificate and private key
          CERT_FILE="$(mktemp -t alloy-cert.XXXXXX).p12"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$CERT_FILE"
          security import "$CERT_FILE" \
            -k "$KEYCHAIN_PATH" \
            -f pkcs12 \
            -t agg \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_FILE"

          # Allow codesign to access the private key without prompting
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PWD" \
            "$KEYCHAIN_PATH"

          # Verify identity is available for codesigning
          security find-identity -v -p codesigning

          # Tell Tauri to sign with the self-signed identity from the default keychain
          echo "TAURI_CONFIG={\"bundle\":{\"macOS\":{\"signingIdentity\":\"$SIGNING_IDENTITY\"}}}" >> "$GITHUB_ENV"
      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/alloy
          tagName: ${{ github.ref_name }}
          releaseName: 'Alloy ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: true
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: true
          args: ${{ matrix.tauri_args }}

  # GitHub's `releases/latest` skips pre-releases, so the app reads its update manifest from a
  # fixed tag instead. Only the tauri-action job's latest.json is published, after every desktop
  # platform has uploaded its bundle (tauri-action merges the platforms into that file).
  publish-update-feed:
    name: Publish update manifest
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Copy latest.json to the updater-feed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$REPO" -p latest.json -O latest.json
          # The four builds merge their entries into this file at nearly the same moment; if two of them
          # collide, one platform can be missing. Never publish a feed that lacks any desktop platform.
          jq -e '.version and (.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("linux-x86_64") and has("windows-x86_64"))' latest.json
          # The in-app changelog shows `notes`: use the release page notes (highlights, grouped commits).
          gh release view "$TAG" -R "$REPO" --json body -q .body > notes.md
          jq --rawfile notes notes.md '.notes = $notes' latest.json > latest.notes.json
          mv latest.notes.json latest.json
          jq -e '.notes | length > 0' latest.json
          gh release view updater-feed -R "$REPO" >/dev/null 2>&1 || \
            gh release create updater-feed -R "$REPO" --prerelease \
              --title "Update feed" \
              --notes "Machine-readable update manifest read by the app. Do not delete."
          gh release upload updater-feed latest.json -R "$REPO" --clobber

  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Same key as the nightly Android build, which populates it from main.
      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64-release
          workspaces: |
            . -> target
          save-if: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      # The UI itself is built by `tauri android build` (beforeBuildCommand); only its dependencies are installed here.
      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Build Android APK (release, arm64)
        working-directory: apps/alloy
        env:
          # Size over speed on phones: 36.7 MB vs 72.5 MB with the plain release profile (#73).
          # panic=abort alone saves about 14 MB of unwind tables.
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_RAW=$(find apps/alloy/src-tauri/gen/android/app/build/outputs -name '*-release-unsigned.apk' | head -n 1)
          [ -n "$APK_RAW" ] || { echo "Android build produced no release APK" >&2; exit 1; }
          scripts/sign-android-apk.sh "$APK_RAW" alloy-android.apk

      # A wrong version code makes Android refuse the update over an installed app (0.2.2 and 0.2.3 shipped as 1 / 1.0).
      - name: Check the APK version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          IFS=. read -r major minor patch <<<"${ver%%-*}"
          code=$((major * 1000000 + minor * 1000 + patch))
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging alloy-android.apk | grep -m1 '^package:')"
          echo "$badging"
          case "$badging" in
            *"versionCode='$code' versionName='$ver'"*) ;;
            *) echo "APK version does not match $TAG (expected code $code, name $ver)" >&2; exit 1 ;;
          esac

      - name: Compute SHA256 Checksums
        run: sha256sum alloy-android.apk > SHA256SUMS

      - name: Upload Android APK and Checksums to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" alloy-android.apk SHA256SUMS --clobber
