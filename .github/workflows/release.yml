name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the pre-release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --prerelease \
              --title "Alloy ${{ github.ref_name }}" \
              --notes "Unsigned pre-release build. See CHANGELOG.md for what is included and the known gaps."

  build-tauri:
    needs: create-release
    name: Build Desktop Bundles (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: ''
            tauri_args: ''
          - os: windows-latest
            platform: windows
            target: ''
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same key as the nightly builds, which populate it from main.
      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-release-${{ matrix.platform }}
          workspaces: |
            . -> target
          save-if: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          cargo cyclonedx --format json --all
          cp apps/alloy/src-tauri/alloy-app.cdx.json alloy-sbom-${{ matrix.platform }}.json

      - name: Export signing secrets that are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri treats an empty variable as "signing requested", so export only non-empty secrets.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
                   APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/alloy
          tagName: ${{ github.ref_name }}
          releaseName: 'Alloy ${{ github.ref_name }}'
          releaseBody: 'Unsigned pre-release build. See CHANGELOG.md for what is included and the known gaps.'
          releaseDraft: false
          prerelease: true
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: true
          args: --verbose ${{ matrix.tauri_args }}

      - name: Upload SBOM to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" alloy-sbom-${{ matrix.platform }}.json --clobber

  # GitHub's `releases/latest` skips pre-releases, so the app reads its update manifest from a
  # fixed tag instead. Only the tauri-action job's latest.json is published, after every desktop
  # platform has uploaded its bundle (tauri-action merges the platforms into that file).
  publish-update-feed:
    name: Publish update manifest
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Copy latest.json to the updater-feed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$REPO" -p latest.json -O latest.json
          jq -e '.version and (.platforms | length > 0)' latest.json
          gh release view updater-feed -R "$REPO" >/dev/null 2>&1 || \
            gh release create updater-feed -R "$REPO" --prerelease \
              --title "Update feed" \
              --notes "Machine-readable update manifest read by the app. Do not delete."
          gh release upload updater-feed latest.json -R "$REPO" --clobber

  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64-release
          workspaces: |
            . -> target
          save-if: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Build Android APK (release, arm64)
        working-directory: apps/alloy
        env:
          # Size over speed on phones: 36.7 MB vs 72.5 MB with the plain release profile (#73).
          # panic=abort alone saves about 14 MB of unwind tables.
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_RAW=$(find apps/alloy/src-tauri/gen/android/app/build/outputs -name '*-release-unsigned.apk' | head -n 1)
          [ -n "$APK_RAW" ] || { echo "Android build produced no release APK" >&2; exit 1; }
          scripts/sign-android-apk.sh "$APK_RAW" alloy-android.apk

      - name: Compute SHA256 Checksums
        run: sha256sum alloy-android.apk > SHA256SUMS

      - name: Upload Android APK and Checksums to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" alloy-android.apk SHA256SUMS --clobber
