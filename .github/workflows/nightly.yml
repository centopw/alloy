name: Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  UI_DIR: apps/alloy

jobs:
  build-nightly-desktop:
    name: Build Nightly Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: ''
            tauri_args: ''
          - os: windows-latest
            platform: windows
            target: ''
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install

      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Build Tauri Desktop Bundle (Unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/alloy
          tagName: nightly
          releaseName: 'Alloy Nightly'
          releaseBody: 'Rolling nightly prerelease builds (unsigned) for testing.'
          releaseDraft: false
          prerelease: true
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}

  build-nightly-android:
    name: Build Nightly Android APK
    runs-on: ubuntu-latest
    needs: build-nightly-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"


      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install
      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Build Android APK (Unsigned / Debug)
        working-directory: apps/alloy
        run: pnpm tauri android build --apk --debug

      - name: Locate and prepare APK
        shell: bash
        run: |
          APK_RAW=$(find apps/alloy/src-tauri/gen/android -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_RAW" ] && [ -f "$APK_RAW" ]; then
            cp "$APK_RAW" alloy-android-nightly.apk
            sha256sum alloy-android-nightly.apk > SHA256SUMS-android.txt
          else
            echo "Error: Android build failed to produce APK"
            exit 1
          fi

      - name: Upload Android APK to Rolling Nightly Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: 'Alloy Nightly'
          body: |
            Rolling nightly prerelease builds (unsigned).
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            alloy-android-nightly.apk
            SHA256SUMS-android.txt
