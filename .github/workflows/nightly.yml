name: Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  UI_DIR: apps/alloy

jobs:
  gate:
    name: Anything new to build?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          # Scheduled runs skip when nothing landed since yesterday; manual runs always build.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build-nightly-desktop:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Build Nightly Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: ''
            tauri_args: ''
          - os: windows-latest
            platform: windows
            target: ''
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-release-${{ matrix.platform }}
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Build Tauri Desktop Bundle (Unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/alloy
          tagName: nightly
          releaseName: 'Alloy Nightly'
          releaseBody: 'Rolling nightly prerelease builds (unsigned) for testing.'
          releaseDraft: false
          prerelease: true
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}

  build-nightly-android:
    name: Build Nightly Android APK
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64-debug
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"


      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile
      - name: Build UI assets
        working-directory: apps/alloy/ui
        run: pnpm build

      - name: Build Android APK (release, arm64)
        working-directory: apps/alloy
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK
        shell: bash
        run: |
          APK_RAW=$(find apps/alloy/src-tauri/gen/android/app/build/outputs -name '*-release-unsigned.apk' | head -n 1)
          [ -n "$APK_RAW" ] || { echo "Android build produced no release APK" >&2; exit 1; }
          scripts/sign-android-apk.sh "$APK_RAW" alloy-android-nightly.apk
          sha256sum alloy-android-nightly.apk > SHA256SUMS-android.txt

      - name: Upload Android APK to Rolling Nightly Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly alloy-android-nightly.apk SHA256SUMS-android.txt --clobber
