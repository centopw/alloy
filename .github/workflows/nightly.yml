name: Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      perf_gate:
        description: 'Fail the desktop perf measurement when a budget is breached (default: report-only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  UI_DIR: apps/alloy

jobs:
  gate:
    name: Anything new to build?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        run: |
          # Scheduled runs skip when nothing landed since yesterday; manual runs always build.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build-nightly-desktop:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Build Nightly Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: ''
            tauri_args: ''
          - os: windows-latest
            platform: windows
            target: ''
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Go (Messenger sidecar)
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/alloy-meta/go.mod
          cache-dependency-path: sidecars/alloy-meta/go.sum

      # `tauri build` bundles `binaries/alloy-meta-<triple>` as the Messenger sidecar next to the app.
      - name: Build the Messenger sidecar
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          [ -n "$triple" ] || triple=$(rustc --print host-tuple)
          case "$triple" in
            *windows*) goos=windows; ext='.exe' ;;
            *darwin*) goos=darwin; ext='' ;;
            *) goos=linux; ext='' ;;
          esac
          case "$triple" in
            aarch64-*) goarch=arm64 ;;
            *) goarch=amd64 ;;
          esac
          mkdir -p apps/alloy/src-tauri/binaries
          ( cd sidecars/alloy-meta && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "../../apps/alloy/src-tauri/binaries/alloy-meta-${triple}${ext}" . )

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-release-${{ matrix.platform }}
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11 xdotool

      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      # Nightlies are unsigned. With updater artifacts on, Tauri wants the private signing key and fails after
      # compiling everything, which also meant no build cache was ever saved from here. `tauri build` already
      # runs the UI build through beforeBuildCommand.
      - name: Turn off updater artifacts (nightlies have no signing key)
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = false' apps/alloy/src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          cp "$RUNNER_TEMP/tauri.conf.json" apps/alloy/src-tauri/tauri.conf.json

      - name: Build Tauri Desktop Bundle (Unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Embedded at compile time so every installed copy identifies Alloy's own Telegram application.
          ALLOY_TELEGRAM_API_ID: ${{ secrets.ALLOY_TELEGRAM_API_ID }}
          ALLOY_TELEGRAM_API_HASH: ${{ secrets.ALLOY_TELEGRAM_API_HASH }}
        with:
          projectPath: apps/alloy
          tagName: nightly
          releaseName: 'Alloy Nightly'
          releaseBody: 'Rolling nightly prerelease builds (unsigned) for testing.'
          releaseDraft: false
          prerelease: true
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}

      # Measures the artifact this job just built (the release nightly bundle), never a dev build.
      # Report-only unless the manual dispatch sets perf_gate=true: the recorded baseline (205 MB idle,
      # 3.4 s cold start p95) is above budget and the fix is #70, so an enforced gate would be born red.
      - name: Measure cold start and idle memory (#69)
        shell: bash
        continue-on-error: ${{ !(github.event_name == 'workflow_dispatch' && inputs.perf_gate == true) }}
        env:
          PERF_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_gate == true }}
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          target_dir="apps/alloy/src-tauri/target"
          if [ -n "${{ matrix.target }}" ]; then target_dir="$target_dir/${{ matrix.target }}"; fi
          app=""
          case "${{ matrix.platform }}" in
            macos-*)
              app=$(find "$target_dir/release/bundle/macos" -type f -perm -111 -path '*/Contents/MacOS/*' 2>/dev/null | head -n 1 || true)
              if [ -z "$app" ] && [ -x "$target_dir/release/alloy-app" ]; then app="$target_dir/release/alloy-app"; fi
              ;;
            windows)
              app="$target_dir/release/alloy-app.exe"
              ;;
            linux)
              app="$target_dir/release/alloy-app"
              ;;
          esac
          if [ -z "$app" ] || [ ! -f "$app" ]; then
            echo "::error::release bundle binary not found under $target_dir/release (platform ${{ matrix.platform }})"
            exit 1
          fi
          echo "Measuring $app"
          gate_args=()
          if [ "${PERF_GATE:-false}" != "true" ]; then gate_args+=(--report-only); fi
          report="perf-${{ matrix.platform }}.json"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
              node scripts/perf-desktop.mjs "$app" --runs 5 --json "$report" --label "nightly ${{ github.sha }}" "${gate_args[@]}"
          else
            node scripts/perf-desktop.mjs "$app" --runs 5 --json "$report" --label "nightly ${{ github.sha }}" "${gate_args[@]}"
          fi

      - name: Summarize perf report
        if: always()
        shell: bash
        env:
          REPORT: perf-${{ matrix.platform }}.json
        run: |
          [ -f "$REPORT" ] || exit 0
          node scripts/perf-summary.mjs "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.platform }}
          path: perf-${{ matrix.platform }}.json
          if-no-files-found: warn

  build-nightly-android:
    name: Build Nightly Android APK
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Go (Messenger sidecar)
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/alloy-meta/go.mod
          cache-dependency-path: sidecars/alloy-meta/go.sum

      # The sidecar ships as a native library so Android extracts it and allows the app to execute it.
      - name: Build the Messenger sidecar into jniLibs
        run: |
          mkdir -p apps/alloy/src-tauri/binaries
          mkdir -p apps/alloy/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cd sidecars/alloy-meta
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' \
            -o ../../apps/alloy/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/liballoymeta.so .
          # The app build script copies `binaries/alloy-meta-<triple>` into the target dir and fails
          # when it is missing, so the triple-named file must exist as well as the jniLibs copy.
          cp ../../apps/alloy/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/liballoymeta.so \
            ../../apps/alloy/src-tauri/binaries/alloy-meta-aarch64-linux-android

      - name: Cache cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64-release
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/alloy/ui/pnpm-lock.yaml

      - name: Record nightly build metadata
        shell: bash
        run: |
          echo "NIGHTLY_VERSION=0.1.0-nightly+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"


      - name: Install UI dependencies
        working-directory: apps/alloy/ui
        run: pnpm install --frozen-lockfile

      - name: Build Android APK (release, arm64)
        working-directory: apps/alloy
        env:
          # Embedded at compile time so every installed copy identifies Alloy's own Telegram application.
          ALLOY_TELEGRAM_API_ID: ${{ secrets.ALLOY_TELEGRAM_API_ID }}
          ALLOY_TELEGRAM_API_HASH: ${{ secrets.ALLOY_TELEGRAM_API_HASH }}
          # Size over speed on phones: 36.7 MB vs 72.5 MB with the plain release profile (#73).
          # panic=abort alone saves about 14 MB of unwind tables.
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK
        shell: bash
        env:
          # Same four secrets as the release workflow. Without them the script falls back to a
          # throwaway key and the nightly cannot exercise the real signing path.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_RAW=$(find apps/alloy/src-tauri/gen/android/app/build/outputs -name '*-release-unsigned.apk' | head -n 1)
          [ -n "$APK_RAW" ] || { echo "Android build produced no release APK" >&2; exit 1; }
          scripts/sign-android-apk.sh "$APK_RAW" alloy-android-nightly.apk
          sha256sum alloy-android-nightly.apk > SHA256SUMS-android.txt

      - name: Upload Android APK to Rolling Nightly Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly alloy-android-nightly.apk SHA256SUMS-android.txt --clobber
